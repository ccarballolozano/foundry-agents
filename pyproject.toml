[project]
name = "foundry-hosted-agent-demo"
version = "0.1.0"
description = "Demo of a Microsoft Foundry hosted agent"
readme = "README.md"
authors = [
    { name = "ccarballolozano", email = "24639237+ccarballolozano@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Agent runtime (each agent's requirements.txt pins what its hosted image installs)
    "agent-framework-core>=1.24.0",
    "agent-framework-foundry>=1.16.0",
    "agent-framework-foundry-hosting>=1.0.0b261030",
    "azure-identity>=1.25.3",
    "python-dotenv>=1.2.3",
    # hr-agent provisioning (agents/hr-agent/provision/)
    "azure-search-documents==12.1.0b2",
    "azure-storage-blob>=12.30.1",
    "pyyaml>=6.0.2",
    # Evaluation and red teaming scripts
    "azure-ai-projects>=2.7.0,<2.8.0",
    "azure-ai-evaluation[redteam]>=1.18.11",
]

[tool.uv]
package = false
