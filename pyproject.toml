[project]
name = "foundry-hosted-agent-demo"
version = "0.1.0"
description = "Demo of a Microsoft Foundry hosted agent"
readme = "README.md"
authors = [
    { name = "ccarballolozano", email = "24639237+ccarballolozano@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core>=1.18.0",
    "agent-framework-foundry>=1.13.0",
    "agent-framework-foundry-hosting>=1.0.0b260910",
    "azure-identity>=1.25.3",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
