# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.34.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.16'
        azure.ai.projects: '>=1.0.0-beta.11'
name: foundry-hosted-agent-demo
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    hr-benefits-agent:
        project: src/foundry_hosted_agent_demo
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: hr-benefits-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        policies:
            - type: rai_policy
              raiPolicyName: /subscriptions/680ee622-8344-44c9-ad90-4de9ea1de560/resourceGroups/foundry-agents-dev-rg-01/providers/Microsoft.CognitiveServices/accounts/foundry-agents-dev-aif-01/raiPolicies/DemoHostedAgent-PII
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
